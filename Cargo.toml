[package]
name = "rojo-doctor"
version = "0.1.0"
edition = "2021"
description = "Actionable structural diagnostics for Rojo projects"
readme = "README.md"
keywords = ["roblox", "rojo", "cli", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
jsonc-parser = { version = "0.27", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
